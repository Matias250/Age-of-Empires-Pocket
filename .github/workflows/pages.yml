# Compila, prueba y publica el juego en GitHub Pages en cada push a main.
name: Publicar juego
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node scripts/bundle.mjs
      - name: Preparar sitio
        run: |
          mkdir -p site
          cp -r index.html styles.css icon.svg *.png manifest.webmanifest sw.js dist site/
          cp build/imperios-pocket.html site/un-archivo.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
